- target: $.info.description
  update: >-
    Public API of the UniView / Unitrends MSP Backup Portal. Read-only access
    to appliances, protected assets, backups, customers, BackupIQ alerts,
    spanning and Microsoft Entra ID domains and users, and the latest endpoint
    agent, scoped to the tenant that issued the credentials. Authenticate with
    OAuth 2.0 client credentials at https://login.backup.net/connect/token and
    send the access token as "Authorization: Bearer {token}".
