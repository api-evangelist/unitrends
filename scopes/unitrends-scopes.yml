note: >-
  The Public API OpenAPI declares only a Bearer header scheme (no oauth2 flows
  or per-operation scopes), so the derive pass yields none. The identity
  service behind it (login.backup.net, UniView / Unitrends MSP portal)
  publishes its supported scopes via OIDC discovery; API access tokens are
  obtained with the OAuth 2.0 client_credentials grant and visibility is
  restricted by the tenant which issued the credentials rather than by
  fine-grained scopes.
