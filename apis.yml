name: Unitrends
description: >-
  Unitrends, a Kaseya company, provides all-in-one backup and disaster recovery
  (BCDR) solutions that secure, defend, and recover data across on-prem data
  centers, cloud, SaaS, and endpoints. The platform spans Recovery Series
  backup appliances, Unitrends Backup software, endpoint backup, and the
  UniView / Unitrends MSP portal, with ransomware detection, automated recovery
  assurance testing, and BackupIQ intelligence. Developers get a UniView Portal
  Public API (OAuth 2.0 client credentials via login.backup.net) for customers,
  appliances, assets, backups, and BackupIQ alerts, plus a documented
  per-appliance REST API and a community PowerShell toolkit.
